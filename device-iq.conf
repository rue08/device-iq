# Reference copy of the host nginx config on the OCI VM. Nothing deploys
# this file: it lives at /etc/nginx/sites-available/device-iq on the VM,
# as a second server block alongside the other project already there
# (railway-observatory) - nginx is shared, not per-project.
#
# One-time host setup (nginx/certbot are already installed for the other
# project on this VM, so just add this site):
#   sudo cp device-iq.conf /etc/nginx/sites-available/device-iq
#   sudo ln -s /etc/nginx/sites-available/device-iq /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d deviceiq.duckdns.org
#
# This is the pre-certbot version. `certbot --nginx` adds the 443 block and
# turns the port 80 block into a redirect; it also installs the renewal timer.
server {
    listen 80;
    listen [::]:80;
    server_name deviceiq.duckdns.org;

    location / {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
