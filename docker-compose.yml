# Runs on the EC2 instance. Postgres is RDS, not a container - see
# DATABASE_URL in backend/.env on the server. nginx and certbot run on the
# host, not in Compose (see nginx/device-iq.conf).
services:
  backend:
    build: ./backend
    env_file: ./backend/.env
    environment:
      PORT: 4000
    volumes:
      # The Firebase key stays on the host, never baked into the image.
      - ./backend/firebase-service-account.json:/app/firebase-service-account.json:ro
    ports:
      # Loopback only: host nginx (TLS via certbot) is the sole way in.
      - "127.0.0.1:4000:4000"
    restart: unless-stopped
